[package]
name = "tari-wallet-benchmarks"
version = "0.1.0"
edition = "2021"
description = "Reproducible wallet performance test harness for Tari (B0/S0-S7 scenarios, Modes 1-3)"

[[bin]]
name = "tari-wallet-benchmarks"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# gRPC (Mode 1 / Mode 3: tari.rpc.Wallet service)
tonic = { version = "0.11", features = ["tls-roots"] }
prost = "0.12"
prost-types = "0.12"

# HTTP client (Mode 2: POST to base node JSON-RPC)
reqwest = { version = "0.12", features = ["json"] }

# CLI argument parsing
clap = { version = "4", features = ["derive", "env"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Misc
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
tempfile = "3"
bs58 = "0.5"
async-trait = "0.1"

[build-dependencies]
tonic-build = "0.11"

[profile.release]
lto = true
codegen-units = 1
